<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GooDraw</title>
<!-- The extension's home screen (home.js), full screen over the page the icon
     was clicked on (background.js → showHome puts it in a frame there), or in
     a tab of its own on the browser's pages. The brand of the Android home:
     the night sky with aurora light, glass, and each tool with a live preview. -->
<style>
  @font-face { font-family: 'Poppins'; font-weight: 500; src: url(fonts/poppins-500.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 700; src: url(fonts/poppins-700.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 800; src: url(fonts/poppins-800.woff2) format('woff2'); }
  :root {
    --bg: radial-gradient(140% 90% at 50% -10%, #6b5bff 0%, #4a3fe0 35%, #3a1f9e 70%, #2a1470 100%);
    --card: rgba(255,255,255,.96); --ink: #1f1f36; --soft: #62627a; --mute: #8a8a9e; --line: #ececf4;
    --glass: rgba(255,255,255,.14); --glass-b: rgba(255,255,255,.3); --accent: #4a4aff; --chip: #f1f0ff;
    --paper: #fff; --rule: #e3e3ee; --word: #a3a3bd;
  }
  html.dark {
    --bg: radial-gradient(140% 90% at 50% -10%, #23236a 0%, #13133a 45%, #0b0b1e 100%);
    --card: rgba(30,30,52,.92); --ink: #ededf7; --soft: #a9a9c2; --mute: #8f8fa8; --line: #33334e;
    --glass: rgba(255,255,255,.07); --glass-b: rgba(255,255,255,.16); --accent: #a5a5ff; --chip: #2a2a48;
    --paper: #26263f; --rule: #3a3a58; --word: #6c6c90;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { background: #3a1f9e; } html.dark { background: #0b0b1e; }
  body { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: #fff; overflow-x: hidden;
    font: 500 14px/1.45 'Poppins', 'Segoe UI', Roboto, Arial, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* Aurora light and stars. */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .sky i { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; }
  .sky .a { width: 60vw; height: 60vh; left: -15vw; top: -20vh; background: #7d7dff; animation: aurA 16s ease-in-out infinite alternate; }
  .sky .b { width: 55vw; height: 60vh; right: -20vw; bottom: -25vh; background: #c084fc; animation: aurB 20s ease-in-out infinite alternate; }
  .sky .c { width: 35vw; height: 35vh; left: 40vw; top: 30vh; background: #ff8a3d; opacity: .18; animation: aurA 24s ease-in-out infinite alternate-reverse; }
  html.dark .sky .a { background: #4a4aff; opacity: .4; } html.dark .sky .b { background: #8b3dff; opacity: .35; } html.dark .sky .c { opacity: .1; }
  .sky s { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .5; animation: tw 4s ease-in-out infinite; }
  @keyframes aurA { to { transform: translate(14vw, 10vh) scale(1.15); } }
  @keyframes aurB { to { transform: translate(-12vw, -10vh) scale(1.1); } }
  @keyframes tw { 50% { opacity: .1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.98); } }
  @keyframes logoIn { from { opacity: 0; transform: scale(.5) rotate(-60deg); } }

  .top { position: relative; z-index: 3; display: flex; align-items: center; gap: 12px; width: 100%; max-width: 1160px; margin: 0 auto; padding: 22px 28px 0; }
  .top img { width: 42px; height: 42px; border-radius: 12px; box-shadow: 0 10px 26px -8px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.25); animation: logoIn .9s cubic-bezier(.2,.9,.2,1.2) both; }
  .top h1 { margin: 0; flex: 1; font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .ib { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--glass-b); background: var(--glass); backdrop-filter: blur(10px); display: grid; place-items: center; padding: 0; flex-shrink: 0; transition: background .15s, transform .15s; }
  .ib:hover { background: rgba(255,255,255,.24); transform: translateY(-1px); }
  .ib svg { width: 19px; height: 19px; }

  /* The cloud, in the top bar: connect, the code while connecting, the space used. */
  .cwrap, .gwrap { position: relative; }
  .cloud { display: flex; align-items: center; gap: 10px; max-width: 340px; padding: 5px 14px 5px 5px; border-radius: 99px; border: 1px solid var(--glass-b);
    background: var(--glass); backdrop-filter: blur(10px); text-align: left; transition: background .15s; }
  .cloud:hover { background: rgba(255,255,255,.24); }
  .cloud .ic { position: relative; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; background: rgba(255,255,255,.18); }
  .cloud .ic svg { width: 18px; height: 18px; }
  .cloud .ic i { position: absolute; right: 0; top: 0; width: 9px; height: 9px; border-radius: 50%; background: #fde047; box-shadow: 0 0 0 3px rgba(253,224,71,.25); }
  .cloud.on .ic i { background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.25); } .cloud.full .ic i { background: #f87171; }
  .cloud .t { min-width: 0; display: flex; flex-direction: column; }
  .cloud b { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .cloud .t span { font-size: 11.5px; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cloud .use { display: block; height: 4px; margin-top: 3px; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; }
  .cloud .use i { display: block; height: 100%; background: #4ade80; }
  .cloud .use.near i { background: #fbbf24; } .cloud .use.full i { background: #f87171; }
  .cloud .code { font: 800 16px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .12em; opacity: 1 !important; }
  .cloud .chev { opacity: .7; }
  .menu, .sheet { position: absolute; right: 0; top: calc(100% + 10px); z-index: 5; display: none; border-radius: 16px; background: var(--card); color: var(--ink);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); animation: rise .2s both; }
  .menu { min-width: 240px; flex-direction: column; gap: 2px; padding: 6px; }
  .menu.open { display: flex; }
  .menu button { border: 0; background: none; text-align: left; padding: 9px 12px; border-radius: 10px; font-weight: 700; color: var(--ink); }
  .menu button:hover { background: var(--chip); }
  .menu button.danger { color: #dc2626; }

  main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: 1160px; margin: 0 auto; padding: 4vh 28px 36px; }
  .hello { margin: 0 0 6px; font-size: clamp(28px, 3.8vw, 44px); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; animation: rise .6s .05s both; }
  .hello em { font-style: normal; background: linear-gradient(90deg, #fde047, #ffb86b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 0 0 28px; font-size: 15.5px; color: rgba(255,255,255,.78); animation: rise .6s .1s both; }
  .warn { margin: -10px 0 22px; padding: 12px 16px; border-radius: 14px; background: rgba(245,158,11,.25); border: 1px solid rgba(253,230,138,.6); font-size: 13.5px; }

  /* Connecting the account: the code to type on the site. */
  .pair { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin: -8px 0 22px; padding: 16px 20px; border-radius: 18px;
    background: rgba(253,224,71,.16); border: 1px solid rgba(253,224,71,.55); animation: rise .4s both; }
  .pair[hidden], .warn[hidden] { display: none; }
  .pair .pb-t { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 2px; }
  .pair .pb-t b { font-size: 15px; }
  .pair .pb-t span { font-size: 13.5px; opacity: .88; }
  .pair .pb-code { font: 800 30px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .14em; padding: 10px 16px; border-radius: 12px; background: rgba(0,0,0,.25); }
  .pair .pb-copy { border: 0; padding: 10px 18px; border-radius: 99px; background: #fde047; color: #3b3200; font-weight: 800; }
  /* The three products: a live preview, the name, a line. */
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .tile { position: relative; display: flex; flex-direction: column; border-radius: 26px; background: var(--card); color: var(--ink);
    box-shadow: 0 30px 60px -30px rgba(10,0,60,.9), 0 0 0 1px rgba(255,255,255,.08); overflow: hidden; animation: rise .65s cubic-bezier(.2,.8,.2,1) both;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
  .tools .tile:nth-child(1) { animation-delay: .15s; } .tools .tile:nth-child(2) { animation-delay: .23s; } .tools .tile:nth-child(3) { animation-delay: .31s; }
  .tile:not(.soon):hover { transform: translateY(-5px); box-shadow: 0 40px 70px -30px rgba(10,0,60,.95), 0 0 0 2px rgba(255,255,255,.35); }
  .tile .go { display: flex; gap: 16px; align-items: flex-start; width: 100%; flex: 1; padding: 20px 24px 22px; border: 0; background: none; text-align: left; color: var(--ink); }
  .tile .go:disabled { cursor: default; opacity: .45; }
  .tile:hover .go:not(:disabled) .name { color: var(--accent); }
  .ico { width: 54px; height: 54px; border-radius: 17px; flex-shrink: 0; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, #4a4aff, #8b3dff); box-shadow: 0 12px 24px -10px rgba(74,74,255,.9), inset 0 1px 0 rgba(255,255,255,.35); }
  .ico.hl { background: linear-gradient(135deg, #ffd43b, #ff8a3d); box-shadow: 0 12px 24px -10px rgba(255,138,61,.95), inset 0 1px 0 rgba(255,255,255,.4); }
  .ico.notes { background: linear-gradient(135deg, #22d3ee, #6366f1); box-shadow: 0 12px 24px -10px rgba(99,102,241,.9), inset 0 1px 0 rgba(255,255,255,.35); }
  .ico.fc { background: linear-gradient(135deg, #a78bfa, #7c3aed); box-shadow: 0 10px 20px -10px rgba(124,58,237,.8); }
  .ico.pl { background: linear-gradient(135deg, #fb7185, #e11d48); box-shadow: 0 10px 20px -10px rgba(225,29,72,.75); }
  .ico.yt { background: linear-gradient(135deg, #ff4d4d, #c4002b); box-shadow: 0 10px 20px -10px rgba(220,0,40,.8); }
  .ico.and { background: linear-gradient(135deg, #34d399, #059669); box-shadow: 0 10px 20px -10px rgba(5,150,105,.8); }
  .ico svg { width: 27px; height: 27px; }
  .name { display: block; font-size: 21px; font-weight: 800; letter-spacing: -.015em; transition: color .15s; }
  .desc { display: block; font-size: 14px; line-height: 1.5; color: var(--soft); margin-top: 3px; }
  .arrow { margin-left: auto; align-self: center; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); color: var(--accent); flex-shrink: 0; transition: transform .2s; }
  .tile:hover .arrow { transform: translateX(4px); }
  /* Three side by side: the names need the room the arrow took. */
  .tools .name { font-size: 19px; }
  .tools .arrow { display: none; }
  /* The Highlights without the permission for every site: one tap to give it. */
  .allow { display: inline-flex; align-items: center; gap: 7px; align-self: flex-start; margin: -8px 24px 18px 94px; padding: 7px 13px; border: 0; border-radius: 99px;
    background: linear-gradient(90deg, #ffd43b, #ff8a3d); color: #3b2300; font: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 18px -10px rgba(255,138,61,.9); }
  .allow:hover { filter: brightness(1.05); }
  .allow svg { width: 14px; height: 14px; }
  .allow[hidden] { display: none; }
  /* The Highlights' corner buttons: only on pages with marks; this hides them even there (hlDockHide). */
  .dockopt { display: flex; align-items: center; gap: 8px; margin: -10px 24px 16px 94px; font-size: 12.5px; color: var(--soft); cursor: pointer; }
  .dockopt input { width: 15px; height: 15px; margin: 0; accent-color: #ff8a3d; cursor: pointer; }
  .tools .tile:nth-child(2) .allow:not([hidden]) { margin-top: -4px; }

  /* The previews: a page being marked, drawn in CSS. */
  .art { position: relative; height: 170px; overflow: hidden; cursor: pointer; }
  .art.d { background: radial-gradient(120% 120% at 20% 0%, #8f8fff 0%, #5b4bff 45%, #7a3dff 100%); }
  .art.h { background: radial-gradient(120% 120% at 80% 0%, #ffe27a 0%, #ffb347 45%, #ff7a3d 100%); }
  html.dark .art.d { background: radial-gradient(120% 120% at 20% 0%, #4646c8 0%, #2d2a8a 60%, #3b1f7a 100%); }
  html.dark .art.h { background: radial-gradient(120% 120% at 80% 0%, #a97a1c 0%, #8a4f1c 60%, #6b2f17 100%); }
  .art.n { background: radial-gradient(120% 120% at 50% 0%, #7ee8fa 0%, #38bdf8 42%, #6366f1 100%); }
  html.dark .art.n { background: radial-gradient(120% 120% at 50% 0%, #0e7490 0%, #1e3a8a 60%, #312e81 100%); }
  .sheetp { position: absolute; left: 50%; top: 26px; width: 300px; height: 170px; margin-left: -150px; border-radius: 14px 14px 0 0; background: var(--paper);
    box-shadow: 0 -10px 40px -10px rgba(0,0,0,.35); padding: 22px 24px; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .tile:hover .sheetp { transform: translateY(-6px); }
  .ln { display: block; height: 8px; border-radius: 4px; background: var(--rule); margin-bottom: 13px; position: relative; }
  .wd { position: absolute; top: -1px; height: 10px; border-radius: 5px; background: var(--word); }
  .opt { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .opt b { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--rule); font-size: 9px; display: grid; place-items: center; color: var(--mute); }
  .opt i { display: block; height: 7px; width: 120px; border-radius: 4px; background: var(--rule); }
  .ink { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .ink path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  /* The pencil's tip rides the very curve being drawn (home.js → drawPreview). */
  .ink .circ, .ink .cross { stroke: #e53935; stroke-width: 3.2; }
  .pen { position: absolute; left: -4.5px; top: -40px; width: 9px; height: 40px; border-radius: 5px; background: linear-gradient(#ffffff, #d9d9ff);
    box-shadow: 0 6px 14px -4px rgba(0,0,0,.45); transform-origin: 50% 100%; will-change: transform, opacity; }
  .pen::after { content: ''; position: absolute; left: 2px; bottom: -6px; border: 2.5px solid transparent; border-top: 6px solid #e53935; }
  .hlbar { position: absolute; top: -4px; left: -4px; height: 16px; border-radius: 3px; background: rgba(253,216,53,.75); width: 0; animation: sweep 5s ease-in-out infinite; }
  .hlbar.g { background: rgba(134,239,172,.8); animation-delay: .9s; }
  @keyframes sweep { 0%, 10% { width: 0; } 32%, 90% { width: calc(100% + 8px); } 100% { width: calc(100% + 8px); opacity: 0; } }
  .note { position: absolute; right: 18px; top: 18px; padding: 6px 10px; border-radius: 10px; background: #fff7c2; color: #5b4a00; font-size: 11px; font-weight: 700;
    box-shadow: 0 8px 18px -8px rgba(0,0,0,.35); transform-origin: 0 100%; animation: note 5s ease-in-out infinite; }
  @keyframes note { 0%, 34% { opacity: 0; transform: scale(.6) translateY(6px); } 42%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  /* The Notes: a topic's cockpit — a card turning, the topic's progress, the week's questions. */
  .nb-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .nb-hd .ln { margin: 0; flex: 1; }
  .nb-b { padding: 3px 7px; border-radius: 6px; background: #e0e7ff; color: #4338ca; font: 800 10px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .04em; }
  html.dark .nb-b { background: #312e81; color: #c7d2fe; }
  .nb-row { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 14px; }
  .nb-card { position: relative; width: 70px; height: 52px; border-radius: 9px; background: var(--paper); border: 1.5px solid var(--rule); display: grid; place-items: center;
    font-weight: 800; font-size: 18px; animation: flip 5s ease-in-out infinite; }
  .nb-card span { grid-area: 1 / 1; }
  .nb-f { color: #6366f1; animation: face 5s steps(1) infinite; }
  .nb-k { color: #16a34a; opacity: 0; animation: face 5s steps(1) infinite reverse; }
  @keyframes flip { 0%, 38% { transform: none; } 44% { transform: scaleX(0); } 50%, 88% { transform: none; } 94% { transform: scaleX(0); } 100% { transform: none; } }
  @keyframes face { 0% { opacity: 1; } 44% { opacity: 0; } 94% { opacity: 1; } }
  .nb-ring { width: 52px; height: 52px; transform: rotate(-90deg); }
  .nb-ring circle { fill: none; stroke-width: 6; }
  .nb-ring .bg { stroke: var(--rule); }
  .nb-ring .fg { stroke: #22c55e; stroke-linecap: round; stroke-dasharray: 113; stroke-dashoffset: 30; animation: ring 5s ease-in-out infinite; }
  @keyframes ring { 0%, 8% { stroke-dashoffset: 113; } 40%, 92% { stroke-dashoffset: 30; } 100% { stroke-dashoffset: 113; } }
  .nb-bars { flex: 1; display: flex; align-items: flex-end; gap: 6px; height: 52px; }
  .nb-bars i { flex: 1; height: var(--h); border-radius: 4px 4px 2px 2px; background: linear-gradient(#818cf8, #6366f1); transform-origin: bottom; animation: bar 5s ease-in-out infinite; }
  .nb-bars i:nth-child(2) { animation-delay: .15s; } .nb-bars i:nth-child(3) { animation-delay: .3s; } .nb-bars i:nth-child(4) { animation-delay: .45s; }
  @keyframes bar { 0%, 6% { transform: scaleY(0); } 34%, 92% { transform: none; } 100% { transform: scaleY(0); } }
  .prem { flex-shrink: 0; padding: 3px 8px; border-radius: 99px; background: linear-gradient(90deg, #4a4aff, #8b3dff); color: #fff; font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .sync { position: absolute; right: 18px; bottom: 44px; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; background: #dcfce7; color: #166534; font-size: 10.5px; font-weight: 800;
    animation: note 5s 1.2s ease-in-out infinite; }

  /* Flashcards, Planner (the Notes' free part) and the Android app; YouTube is in the footer. */
  .more { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 22px; }
  .more .tile { border-radius: 22px; }
  .more .tile:nth-child(1) { animation-delay: .31s; } .more .tile:nth-child(2) { animation-delay: .37s; } .more .tile:nth-child(3) { animation-delay: .43s; } .more .tile:nth-child(4) { animation-delay: .49s; }
  .more .tile .go { align-items: center; gap: 14px; padding: 18px 20px; }
  .more .ico { width: 46px; height: 46px; border-radius: 14px; }
  .more .ico svg { width: 23px; height: 23px; }
  .more .name { font-size: 15.5px; }
  .more .desc { font-size: 12.5px; margin-top: 1px; }
  .tile.soon .go { cursor: default; }
  .tile.soon .ico { opacity: .55; filter: grayscale(.3); }
  .tile.soon .name { color: var(--mute); }
  .pill { display: inline-block; margin-top: 4px; padding: 2px 9px; border-radius: 99px; background: linear-gradient(90deg, #4a4aff, #8b3dff); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

  .ticket-go { display: flex; width: fit-content; align-items: center; gap: 8px; margin: 28px auto 0; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line, rgba(127,127,160,.3)); background: transparent; color: inherit; font: inherit; font-size: 13.5px; cursor: pointer; opacity: .85; animation: rise .6s .45s both; }
  .ticket-go:hover { opacity: 1; border-color: currentColor; }
  .ticket-go svg { width: 16px; height: 16px; }
  .foot { display: flex; justify-content: center; gap: 12px; margin-top: 34px; animation: rise .6s .5s both; }

  /* The gear: this site, language and theme. */
  .sheet { width: 300px; padding: 14px; }
  .sheet.open { display: block; }
  .sheet h3 { margin: 4px 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
  .seg { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .seg button { border: 1px solid var(--line); background: none; color: var(--ink); padding: 5px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 700; }
  .seg button.on { background: linear-gradient(135deg, #4a4aff, #8b3dff); border-color: transparent; color: #fff; }
  #siteBox:not(:empty) { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  #siteBox .host { display: flex; gap: 6px; font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
  #siteBox .host span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #siteBox .host em { margin-left: auto; font-style: normal; font-weight: 500; color: var(--mute); white-space: nowrap; }
  .sw { display: flex; align-items: center; gap: 8px; margin-top: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; }
  .sw input { appearance: none; width: 32px; height: 19px; border-radius: 10px; background: #d4d4e0; position: relative; margin: 0; flex-shrink: 0; cursor: pointer; transition: background .2s; }
  html.dark .sw input { background: #4a4a66; }
  .sw input::after { content: ''; position: absolute; left: 2px; top: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .sw input:checked { background: #22c55e; }
  .sw input:checked::after { transform: translateX(13px); }
  .toast { position: fixed; z-index: 9; left: 50%; bottom: 24px; transform: translateX(-50%); background: #16162a; color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px; font-weight: 700; display: none; max-width: 90vw; text-align: center; }

  /* Not room for three: the Notes takes the whole second row. */
  @media (max-width: 1040px) and (min-width: 821px) {
    .tools { grid-template-columns: 1fr 1fr; }
    .tools .tile:nth-child(3) { grid-column: 1 / -1; }
    .tools .name { font-size: 21px; }
    .tools .arrow { display: grid; }
  }
  @media (max-width: 820px) {
    .tools, .more { grid-template-columns: 1fr; gap: 14px; }
    .tools .name { font-size: 21px; }
    .tools .arrow { display: grid; }
    .more { margin-top: 14px; }
    .cloud .t span, .cloud .use { display: none; }
    main { padding-top: 4vh; }
  }
  @media (max-height: 760px) and (min-width: 821px) { main { padding-top: 3vh; } .art { height: 140px; } .sub { margin-bottom: 20px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .hlbar { width: calc(100% + 8px); } .note, .sync { opacity: 1; } .nb-k { display: none; } }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i>
  <s style="left:12%;top:18%"></s><s style="left:28%;top:8%;animation-delay:1s"></s><s style="left:64%;top:14%;animation-delay:2s"></s><s style="left:82%;top:26%;animation-delay:.5s"></s>
  <s style="left:8%;top:62%;animation-delay:1.5s"></s><s style="left:92%;top:70%;animation-delay:2.5s"></s><s style="left:46%;top:4%;animation-delay:3s"></s></div>

<header class="top">
  <img src="icons/icon128.png" alt="">
  <h1>GooDraw</h1>
  <div class="cwrap"><button class="cloud" id="cloud"></button><div class="menu" id="cloudMenu"></div></div>
  <div class="gwrap">
    <button class="ib" id="gear" data-tl="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <div class="sheet" id="sheet">
      <div id="siteBox"></div>
      <h3 data-t="iconOpens"></h3><div class="seg" id="iconSeg"></div>
      <h3 data-t="hlMenu"></h3><div class="seg" id="hlSeg"></div>
      <h3 data-t="lang"></h3><div class="seg" id="langSeg"></div>
      <h3 data-t="theme"></h3><div class="seg" id="themeSeg"></div>
    </div>
  </div>
  <button class="ib" id="close" data-tl="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</header>

<main>
  <h2 class="hello" data-h="hello"></h2>
  <p class="sub" data-t="sub"></p>
  <div class="warn" id="page" hidden></div>
  <div class="pair" id="pairBox" hidden></div>

  <div class="tools">
    <div class="tile" id="drawTile">
      <div class="art d" data-open="draw" aria-hidden="true">
        <div class="sheetp">
          <span class="ln" style="width:92%"></span>
          <span class="ln" style="width:80%"><span class="wd" style="left:46%;width:22%"></span></span>
          <span class="ln" style="width:86%"></span>
          <div class="opt"><b>A</b><i></i></div>
          <svg class="ink" viewBox="0 0 300 170"><path class="circ" d="M108 46 C 108 30, 200 28, 205 44 C 210 60, 120 64, 112 50"/><path class="cross" d="M24 98 L 170 98"/></svg>
          <span class="pen"></span>
        </div>
      </div>
      <button class="go" id="drawGo">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/></svg></span>
        <span class="tx"><span class="name">GooDraw</span><span class="desc" data-t="drawDesc"></span></span>
        <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>
    </div>
    <div class="tile" id="hlTile">
      <div class="art h" data-open="hl" aria-hidden="true">
        <div class="sheetp">
          <span class="ln" style="width:88%"><span class="hlbar"></span></span>
          <span class="ln" style="width:94%"></span>
          <span class="ln" style="width:70%"><span class="hlbar g"></span></span>
          <span class="ln" style="width:84%"></span>
          <span class="note" data-t="artNote"></span>
          <span class="sync"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span data-t="artSync"></span></span>
        </div>
      </div>
      <button class="go" id="hlGo">
        <span class="ico hl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></span>
        <span class="tx"><span class="name">GooHighlights</span><span class="desc" data-t="hlDesc"></span></span>
        <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>
      <label class="dockopt"><input type="checkbox" id="hlDockHide"><span data-t="dockHide"></span></label>
      <button class="allow" id="hlAllow" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg><span data-t="allowAll"></span></button>
    </div>
    <div class="tile" id="notesTile">
      <div class="art n" data-open="notes" aria-hidden="true">
        <div class="sheetp">
          <div class="nb-hd"><span class="nb-b">INF</span><span class="ln"></span><span class="prem">Premium</span></div>
          <div class="nb-row">
            <div class="nb-card"><span class="nb-f">?</span><span class="nb-k">✓</span></div>
            <svg class="nb-ring" viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fg" cx="22" cy="22" r="18"/></svg>
            <div class="nb-bars"><i style="--h:45%"></i><i style="--h:72%"></i><i style="--h:58%"></i><i style="--h:92%"></i></div>
          </div>
          <span class="ln" style="width:84%"></span>
        </div>
      </div>
      <button class="go" id="notesGo">
        <span class="ico notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
        <span class="tx"><span class="name">GooNotes</span><span class="desc" data-t="notesDesc"></span></span>
        <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>
    </div>
  </div>

  <div class="more">
    <div class="tile">
      <button class="go" id="fcGo">
        <span class="ico fc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="15" height="14" rx="2"/><path d="M7 3h13a2 2 0 0 1 2 2v11"/></svg></span>
        <span class="tx"><span class="name">Flashcards</span><span class="desc" data-t="fcDesc"></span></span>
      </button>
    </div>
    <div class="tile">
      <button class="go" id="plGo">
        <span class="ico pl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v3l2 1"/></svg></span>
        <span class="tx"><span class="name">Planner</span><span class="desc" data-t="plDesc"></span></span>
      </button>
    </div>
    <div class="tile">
      <button class="go" id="android">
        <span class="ico and"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M11 18h2"/></svg></span>
        <span class="tx"><span class="name" data-t="andName"></span><span class="desc" data-t="ios"></span></span>
      </button>
    </div>
  </div>

  <button class="ticket-go" id="ticketGo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span data-t="ticket"></span></button>
  <div class="foot">
    <button class="ib" data-s="youtube" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.8 15.1V8.9L15.6 12z"/></svg></button>
    <button class="ib" data-s="instagram" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></button>
    <button class="ib" data-s="rate" data-tl="rate"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg></button>
  </div>
</main>
<div class="toast" id="toast"></div>
<script src="home.js"></script>
</body>
</html>
